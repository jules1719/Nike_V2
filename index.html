<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Student prototype (MCI design sprint). Not affiliated with or endorsed by Nike or Strava. No real orders.">
  <title>Nike Shoe Fit v2 · Student Prototype</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="shell" id="shell">
    <header class="appbar" id="appbar"></header>
    <main id="app" class="screen" tabindex="-1"></main>
    <footer class="disclaimer" id="disclaimer">Student prototype (MCI design sprint). Not affiliated with or endorsed by Nike or Strava. No real orders.</footer>
  </div>
  <div id="overlay-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- Static copy of the survey form so Netlify Forms detects it at deploy time. The app submits to it via fetch. -->
  <form name="survey" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="survey">
    <input name="bot-field">
    <input name="app_version"><input name="clarity"><input name="benefit_clear"><input name="fit_accuracy">
    <input name="lang"><input name="trust"><input name="scan_real"><input name="share_data"><input name="wtp_eur">
    <input name="most_convincing"><input name="most_confusing"><textarea name="comment"></textarea>
    <input name="sus_1"><input name="sus_2"><input name="sus_3"><input name="sus_4"><input name="sus_5">
    <input name="sus_6"><input name="sus_7"><input name="sus_8"><input name="sus_9"><input name="sus_10">
    <input name="sus_score"><input name="usecase"><input name="video_mode"><input name="scan_source">
    <textarea name="event_log"></textarea>
  </form>

  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
